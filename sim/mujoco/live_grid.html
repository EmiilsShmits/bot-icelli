<!doctype html><html><head><meta charset="utf-8"><title>MuJoCo stress live</title>
<style>body{background:#111;color:#ccc;font:12px system-ui;margin:8px}.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
img{width:100%;display:block;border:1px solid #333;min-height:120px;background:#000}pre{margin:2px 0 0;white-space:pre-wrap;height:3.2em;overflow:hidden}</style></head>
<body><div class="g" id="g"></div><script>
const P=[18180,18181,18280,18281];const g=document.getElementById('g');
P.forEach(p=>{const d=document.createElement('div');const i=document.createElement('img');const s=document.createElement('pre');
d.append(i,s);g.append(d);const load=()=>{i.src='http://localhost:'+p+'/stream?'+Date.now()};i.onerror=()=>setTimeout(load,3000);load();
setInterval(async()=>{try{const j=await (await fetch('http://localhost:'+p+'/status')).json();
s.textContent=(p<18200?'sim-6':'sim-5')+' w'+(p%10)+'  '+(j.tag||'')+'  '+(j.task||'')+'  '+(j.state||'')+'  '+JSON.stringify(j.results||'')}catch(e){s.textContent='between episodes…'}},2000)});
</script></body></html>
