# "Venue" look for Aalto's sim: appearance of the real table at Junction, taken from ONE phone photo
# (Sat 14 Nov, shot from above). Used through AALTO_LOOK=<this file> after patch_aalto.py; see README.md.
# Colours are sRGB 0-255 as sampled from the photo (the patch converts them to the linear values the renderer wants).
# Estimates from a phone photo, not measurements.
name: venue

objects:
  # Sim colour NAME -> real colour. The real objects are orange, purple and yellow (plus black, unused here);
  # Aalto's docs and instructions say red, yellow, blue.
  # ASSUMPTION, NOT CONFIRMED BY THE ORGANISERS: "red" = orange, "blue" = purple.
  colors:
    red: [240, 145, 45]       # orange  (photo: 244,153,55 / 250,151,49 / 233,136,19)
    yellow: [240, 216, 42]    # yellow  (photo: 242,217,36 / 238,220,62)
    blue: [163, 135, 230]     # purple  (photo: 161,135,233 / 172,138,228)
  roughness: 0.6              # matte foam/plastic, slightly shinier than Aalto's 0.7

table:
  texture: plywood.png        # generated by make_assets.py; replaces the printed grid mat
  cover_counter: true         # texture the whole table top, not just the mat area
  roughness: 0.35             # the real top is varnished: the photo shows a clear light reflection

counter:
  rgb: [190, 150, 122]        # table edges, same plywood tone (photo: 210,165,139 / 213,170,136)
  roughness: 0.5

bins:
  rgb: [238, 125, 70]         # orange tape/paper outside and on the rim (photo: 245,142,90 lit, 184,67,39 shaded)
  roughness: 0.6
  liner_rgb: [200, 168, 128]  # bare cardboard inside (photo: 204,172,131 floor, 118,84,55 shaded wall)
  liner_below_rim: 0.008      # the orange wraps ~8 mm over the rim
  # Orange paper/tape folded over the top of a box, covering part of the opening. Per bin; widths in m, measured
  # inward from the box's outer edge, sides as the robot sees them. In the photo only the MIDDLE box has it.
  # Widths estimated from the photo (box = 21 cm wide): rough, +-1 cm.
  rim_tape:
    center: {near: 0.04, far: 0.03, left: 0.03, right: 0.025}
  rim_tape_rgb: [242, 138, 80]   # lit from above, so a little lighter than the box sides (photo: 245,142,90)
  rim_tape_collide: false        # false = visual only (objects fall through it); true = solid ledge. Unknown how stiff it is

lid:
  rgb: [200, 194, 168]        # beige shape-sorter board (rung 3)

floor:
  rgb: [14, 14, 18]           # dark floor
backdrop:
  rgb: [10, 12, 18]           # black curtains (photo: 9,12,19)
  distance: 1.5               # m from the pelvis: behind the bins and on both sides
  height: 3.0

lights:                       # one overhead lamp, little ambient light (black curtains all round)
  dome_intensity: 250.0       # Aalto nominal 800
  dome_color: [0.85, 0.87, 0.95]
  key_intensity: 60000.0      # = Aalto nominal
  key_color: [1.0, 0.96, 0.9]
  key_pos: [0.45, 0.0, 2.2]
