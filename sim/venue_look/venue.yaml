# "Venue" look for Aalto's sim: appearance of the real table at Junction, taken from one phone photo
# (Sat 14 Nov, shot from above) and from the head-camera video in Aalto's two real datasets.
# Used through AALTO_LOOK=<this file> after patch_aalto.py; see README.md.
# Colours are sRGB 0-255 as sampled from the photo (the patch converts them to the linear values the renderer wants).
# Estimates from images, not measurements.
name: venue

camera:
  # Where the real head camera points, relative to Aalto's calibration.yaml (a URDF default, not measured).
  # Fitted to the middle bin's corners in one frame of each real dataset:
  #   g1_pick_cube        (drop 1): 7.9 deg further down, 1.0 deg roll, camera 4.7 cm to the robot's left
  #   g1_junction_drop_2  (drop 2): 12.2 deg further down, 1.1 deg roll, camera 0.6 cm to the robot's left
  # The view also shifts within a dataset. Values below = the middle of the two, minus what the renderer adds itself:
  # it ignores the calibrated principal point (cx 325, cy 251 -> 320, 240), which equals 1.0 deg pitch and 0.5 deg yaw.
  head:
    pitch_down_deg: 9.0       # fitted 10.0 (mean of 7.9 and 12.2) - 1.0 for the principal point
    roll_deg: 1.0
    yaw_deg: -0.5             # principal point only
    shift_m: [0.0, 0.025, 0.0]   # pelvis frame (x forward, y left, z up)

objects:
  # Sim colour NAME -> real colour. The real objects are orange, purple and yellow (confirmed by Aalto);
  # their docs and instructions say red, yellow, blue.
  # ASSUMPTION, NOT CONFIRMED BY THE ORGANISERS: "red" = orange, "blue" = purple.
  # Values tuned so the objects read like in the real head camera (median over 24 real frames:
  # purple 57,62,117; yellow 148,138,71; orange top 251,160,81, side 156,60,12). They are darker and less
  # saturated there than in the phone photo.
  colors:
    red: [250, 140, 55]       # orange
    yellow: [218, 204, 88]    # yellow
    blue: [92, 96, 182]       # blue-violet
  roughness: 0.6              # matte foam/plastic, slightly shinier than Aalto's 0.7

table:
  texture: plywood.png        # generated by make_assets.py; replaces the printed grid mat
  cover_counter: true         # texture the whole table top, not just the mat area
  roughness: 0.14             # the real top is varnished: the head camera shows white glare and reflections
  # Orange tape stuck on the table right in front of each bin. Mat coordinates (x = robot's left, y = away), metres.
  # Centre and left mark back-projected from a real frame; the right one is assumed to mirror the left.
  tape_rgb: [235, 105, 60]
  tape_marks:
    - {center: [0.453, 0.240], size: [0.100, 0.030]}
    - {center: [0.727, 0.250], size: [0.075, 0.018]}
    - {center: [0.173, 0.250], size: [0.075, 0.018]}

counter:
  rgb: [200, 168, 156]        # table edges, same tone as the top
  roughness: 0.5

bins:
  rgb: [228, 98, 58]          # red-orange paper outside (head camera: 123,40,30 and 100,34,26 on the shaded front)
  roughness: 0.6
  liner_rgb: [190, 182, 160]  # grey-beige cardboard inside (head camera: floor 151,152,146 / 133,138,131)
  liner_below_rim: 0.008      # the orange wraps ~8 mm over the rim
  # Orange paper/tape folded over the top of a box, covering part of the opening. Per bin; widths in m, measured
  # inward from the box's outer edge, sides as the robot sees them. The head camera shows it on all three boxes:
  # wide on the middle one, about 1 cm on the outer two. Widths estimated from images (box = 21 cm wide), +-1 cm.
  rim_tape:
    center: {near: 0.03, far: 0.015, left: 0.035, right: 0.03}
    left: {near: 0.012, far: 0.01, left: 0.012, right: 0.012}
    right: {near: 0.012, far: 0.01, left: 0.012, right: 0.012}
  rim_tape_rgb: [245, 135, 105]  # lit from above, so lighter and pinker than the sides (head camera: 228,152,134)
  rim_tape_crumple: 0.0025       # m. Paper is uneven: each strip is cut in 4 pieces with slightly different width, height and shade
  rim_tape_collide: false        # false = visual only (objects fall through it); true = solid ledge. Unknown how stiff it is

lid:
  rgb: [200, 194, 168]        # beige shape-sorter board (rung 3)

floor:
  rgb: [14, 14, 18]           # dark floor
backdrop:
  rgb: [10, 12, 18]           # black curtains (photo: 9,12,19)
  distance: 2.2               # m from the pelvis: behind the bins and on both sides
  height: 3.0

lights:
  # One lamp in front of the robot on its right, plus weak cool room light. Lamp position worked out from the glare
  # patch on the table in both real datasets (assuming the lamp hangs about 2 m above the table).
  dome_intensity: 250.0       # Aalto nominal 800
  dome_color: [0.8, 0.88, 1.0]
  key_intensity: 60000.0      # = Aalto nominal
  key_color: [0.86, 0.92, 1.0]   # the real camera's white balance is cool: the table reads grey-pink, not tan
  key_pos: [1.4, -0.95, 2.8]  # SIM WORLD frame (x forward, y left, z up from the floor) = pelvis frame + 0.79 m up
  key_radius: 0.25

render:                       # renderer settings, applied once the sim runs (all cameras)
  /rtx/post/motionblur/enabled: true          # the real video smears when the arms move
  /rtx/post/motionblur/exposureFraction: 1.0
  /rtx/post/motionblur/maxBlurDiameterFraction: 0.05
  /rtx/post/dof/overrideEnabled: true         # soft focus: the real image is not sharp anywhere
  /rtx/post/dof/enabled: true
  /rtx/post/dof/subjectDistance: 4.0
  /rtx/post/dof/focalLength: 20.0
  /rtx/post/dof/fNumber: 8.0

robot:
  arm:                        # what the real head camera shows of the forearms
    sides: [left, right]      # only the left one is clearly visible in the real video; the right is assumed the same
    wrist_rgb: [200, 204, 210]        # bare aluminium wrist housings (Aalto's model: grey)
    wrist_metallic: 0.85
    wrist_roughness: 0.3
    camera_mount_rgb: [214, 214, 208] # white 3-D printed wrist-camera mount
    cable:                    # black camera cable looping from the mount back along the forearm
      link: wrist_roll        # points are in this link's frame: x towards the hand, y to the robot's left, z up (arm forward)
      width: 0.006
      rgb: [14, 14, 14]
      points: [[0.09, 0.0, 0.07], [0.06, 0.04, 0.12], [0.0, 0.06, 0.13], [-0.06, 0.04, 0.09], [-0.10, 0.01, 0.04]]

scene:                        # GEOMETRY overrides on Aalto's scene.yaml -> scene_venue.yaml (make_assets.py). Physics too
  bins:
    wall_height: 0.075        # fitted from the real frames (7.1 and 7.9 cm); Aalto's 6 cm is an unmeasured default
  layout:                     # where objects start. Real objects (67 sightings in 24 frames) sit at mat x 0.36-0.55
    region_x: [0.30, 0.60]    #   (max 0.72), y 0.03-0.20 (median 0.11), up to 6 at once, often touching.
    region_y: [0.04, 0.20]    #   Aalto: x 0.28-0.62, y 0.12-0.19 (one row), spacing 8 cm, 3-5 objects
    min_spacing: 0.065        # object = 4.5 cm; 6.5 cm lets two cubes almost touch without overlapping
    n_cubes: [3, 6]
